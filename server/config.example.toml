# desk-panel — the PC server's runtime configuration.
#
#   cp server/config.example.toml server/config.toml
#
# Then edit that copy. `config.toml` is gitignored and never leaves the PC;
# this file is committed and holds no secret.
#
# Everything here is read when the server starts, so changing any of it needs
# a server restart and **never a rebuild of the APK**. That is a project rule,
# not a convenience: if changing what the panel shows meant reinstalling the
# app, the design would be broken (ADR 0013). The only things that do need a
# rebuild live in `.env` — the PC's LAN address, the signing key, the
# orientation — and an API token must never be one of them.
#
# This file is TOML. YAML was what was asked for and is not available: the
# server is standard-library-only so that it runs on a clean box, and PyYAML
# is a dependency, while `tomllib` has shipped with Python since 3.11. What
# the request was actually about — comments, no trailing-comma traps, bare
# keys — TOML has.
#
# A `config.json` from before this file existed is still read, unchanged. It
# just cannot carry any of the notes below, which is the reason to move.


# The port the server listens on. The phone reaches it at
# http://<PC-IP>:8777/, and the address half of that is baked into the APK
# (`PC_IP` in .env), so changing the port here means changing it on the phone
# too — and reopening it in the firewall. There is rarely a reason to.
port = 8777


# ---------------------------------------------------------------------------
# B3 stock quotes — brapi.dev
# ---------------------------------------------------------------------------

# Your brapi token, or "" for none. It is sent as an Authorization header and
# is never included in anything the phone receives (ADR 0004). This is the one
# secret in the file, and the reason `config.toml` is gitignored.
brapi_token = ""

# **Which tickers work without a token.** Exactly these four:
#
#     PETR4   MGLU3   VALE3   ITUB4
#
# They are brapi's documented free sample. Any other B3 ticker needs a token;
# without one the request for it is refused and that row simply is not on the
# panel. At the default `brapi_symbols_per_request = 1` below, a refused
# ticker costs only its own row — the rest of the card still renders.
#
# Spelling is the B3 ticker as written on the exchange, uppercase, no ".SA"
# suffix and no exchange prefix.
quotes = ["PETR4", "VALE3", "ITUB4"]

# How many tickers may ride in one request. **One is what brapi's free plan
# allows**, and asking for more is not a partial success — the whole request
# is refused, with `400 QUOTES_PER_REQUEST`, and every symbol in it is lost
# together. Raise this only to the number your paid plan actually permits.
brapi_symbols_per_request = 1


# ---------------------------------------------------------------------------
# FX — AwesomeAPI (no token, no account)
# ---------------------------------------------------------------------------

# Any pair AwesomeAPI serves, spelled `FROM-BRL` with a hyphen — that is the
# spelling this file uses and the one the upstream uses. The panel renders it
# as `USD/BRL`; do not write the slash here. `USDBRL` is accepted too, for a
# config typed the other way.
#
# `USD-BRL`, `EUR-BRL`, `GBP-BRL`, `ARS-BRL` and `BTC-BRL` all answer. So do
# about 540 others: the upstream lists every one of them, name included, at
#
#     https://economia.awesomeapi.com.br/json/available
#
# A pair it does not serve costs its own row and nothing else.
fx = ["USD-BRL", "EUR-BRL"]


# ---------------------------------------------------------------------------
# Crypto — Binance (no token, no account)
# ---------------------------------------------------------------------------

# Any Binance symbol, spelled **bare**: `BTC`, not `BTCUSDT` and not
# `BTC/USDT`. Everything here is quoted against USDT, which the server appends
# on the way out and strips on the way back; the panel labels it USD, since a
# stablecoin pegged 1:1 is honest at the precision a desk panel shows.
#
# `BTC`, `ETH`, `SOL`, `XRP`, `DOGE` and `ADA` all answer, as does anything
# else holding a USDT spot pair — there are a few thousand, and the upstream
# lists them all as `<COIN>USDT` entries at
#
#     https://api.binance.com/api/v3/ticker/price
#
# A coin without a USDT pair costs its own row and nothing else.
crypto = ["BTC", "ETH"]


# ---------------------------------------------------------------------------
# Weather — Open-Meteo (no token)
# ---------------------------------------------------------------------------

# The city is geocoded by name, and the first match wins. Plain ASCII is the
# safe spelling: Windows' console and an older Python reading this file as
# cp1252 both mangle "São Paulo", and a mangled name geocodes to nothing.
# Add the country when a name is ambiguous — "Santos, BR".
city = "Sao Paulo"

# An IANA timezone name, and it is load-bearing rather than cosmetic. It is
# what cuts the forecast into days: without it the upstream cuts them on UTC,
# so after 21:00 in Sao Paulo the panel shows *tomorrow's* high as today's —
# a wrong number rather than an error. Set it to the city's own zone.
timezone = "America/Sao_Paulo"

# Where the forecast is read, in decimal degrees, as a pair. The values below
# are Sao Paulo's centre, where the geocode lands anyway; in a city this size
# that can be a different weather from your street, so point them there.
# Optional: delete both lines and the city above is geocoded instead.
# Set, they win over the geocode and `city` is only the label on the card,
# shown as spelled here ("Sao Paulo", not the geocoder's "São Paulo"). So
# changing `city` means changing these two, or deleting them.
# Plain numbers, not strings. A single one, a quoted one or a point off the
# globe stops the server at startup, and `--check-only` says so first.
latitude = -23.5475
longitude = -46.6361


# ---------------------------------------------------------------------------
# How often to refresh — seconds
# ---------------------------------------------------------------------------
# These govern how often the *server* asks an upstream. The phone's own poll
# is a separate, faster clock and is not configurable: it only ever asks this
# server, which is already caching, so nothing the phone does can spend an API
# budget.

# 600, not 300, and the arithmetic is the reason. brapi's free plan allows one
# symbol per request and about 15,000 requests a month, so the three tickers
# above cost three requests per refresh. At 300s that is 25,920 a month
# against a 15,000 budget and the B3 card goes permanently stale around the
# 17th; at 600s it is 12,960 with the PC logged in around the clock. More
# tickers, or a shorter interval, and that arithmetic has to be redone: four
# tickers at 600s is 17,280 around the clock.
#
# "Around the clock" is `b3_hours = []`. With the default `b3_hours` below,
# brapi is asked only during B3's session and those numbers shrink to about a
# quarter -- 300s would fit -- but 600 stays the default because it has to be
# safe with the gate off, and because FX and crypto share this interval.
#
# History is on top of that: one brapi request per ticker every
# `history_interval_s` below, so four a day per ticker at the default -- 480 a
# month for four tickers, and four tickers then fit only if this PC is logged
# in less than about 84% of the month -- again with the gate off; with it,
# brapi's history is refreshed only inside the session and once after the
# close, about two a weekday per ticker. **While any ticker's history is
# missing** (a paid ticker without a token, a refresh that failed) the history
# retries every `quotes_interval_s` instead, for every ticker, which roughly
# doubles the spend: fix or remove the missing ticker rather than living with it.
#
# Quotes and history are fetched when the panel asks, so with more than one PC
# (ADR 0016) only the one the phone is on spends them. The exception is
# startup: every login fetches every ticker's history once, on every PC that
# logs in, whether or not the phone is looking at it -- spent twice when two
# PCs share a token.
quotes_interval_s = 600

# Open-Meteo allows 10,000 requests a day for non-commercial use, so this is
# not near any limit. Weather does not move faster than this anyway.
weather_interval_s = 900

# The moon's phase, from the US Naval Observatory
# (aa.usno.navy.mil/api/moon/phases) -- no key, no registration. It is the
# slowest thing this panel shows: the lit fraction moves about three points a
# day, and what the API actually returns is a table of phase *instants* that
# does not change between them at all. Six hours is four requests a day and a
# stale answer is invisible.
#
# If the request fails the server falls back to arithmetic over the mean
# synodic month and marks the answer `source = "mean"`. That names the phase
# correctly -- checked against the USNO's own 2026 and 2027 tables, 99 primary
# phases, none named wrong -- but its age can be most of a day out, which is a
# visibly different moon on the nights either side of a quarter. There is
# nothing to configure about the fallback; it is documented here so that a
# payload reading `"source": "mean"` is not a mystery.
moon_interval_s = 21600

# The sparkline's series: daily closes, which change once a day, so this is on
# a clock measured in hours. Six hours costs four requests a day per ticker,
# pair or coin -- each series is its own request, on all three providers --
# except brapi's while `b3_hours` holds it outside the session.
history_interval_s = 21600

# How many days of history the sparkline covers. brapi only accepts named
# ranges (5d, 1mo, 3mo, 6mo, 1y, 5y) and rounds up to the nearest one that
# covers this; the other two providers take the count as written.
history_days = 30

# When brapi is asked for B3 prices and history at all. Outside this window
# the panel keeps what it fetched after the last close -- Friday's close all
# weekend -- and spends nothing, which is most of the month: three tickers at
# 600s cost about 3,000 to 3,700 quote requests a month (December, with 23
# weekdays in the winter window, is the top), against 12,960 around the clock.
# History and cold starts are on top.
#
#   "auto"              B3's own session, weekdays, Sao Paulo time. It opens at
#                       10:00 and closes at 17:00 while the US is on daylight
#                       saving (second Sunday of March to first Sunday of
#                       November) and at 18:00 the rest of the year -- B3
#                       follows the US clock, not Brazil's. Plus 45 minutes,
#                       because the free plan serves quotes ~30 minutes late.
#   ["10:00", "18:45"]  a fixed window, weekdays, Sao Paulo time, all year.
#                       For the after-market, or a paid plan with less delay.
#   []                  never hold back: refresh every quotes_interval_s.
#
# Only an answer that is safe to hold is held: complete, not STALE, and
# fetched after the latest close. So a cold start or a missing row is fetched
# whatever the hour, a refresh that failed is retried, and a price from before
# the close -- a long interval, a PC that slept -- is refreshed once more.
#
# **A ticker brapi always refuses switches this off.** Its row never arrives,
# the answer is never complete, and every ticker is asked for around the clock
# again. Remove the ticker, or give it the token it needs.
#
# Holidays are not known: a holiday costs an ordinary weekday, and the CLOSED
# label beside the B3 title says the market is open on one. The label follows
# the exchange's own session, whatever this says.
b3_hours = "auto"


# ---------------------------------------------------------------------------
# Presentation
# ---------------------------------------------------------------------------

# The night profile's window, 24-hour "HH:MM", local to the panel. Inside it
# the panel dims. A window that wraps midnight is normal and is what these
# defaults do.
night_start = "22:00"
night_end = "07:00"

# Whether the panel also sleeps while this PC's display is off — the monitor
# gone dark on the power plan's timer, or put to sleep by hand — and not only
# while nobody is logged in (ADR 0020). It wakes with the monitor, within the
# phone's two-second poll.
#   true   the default. Read on Windows (the console display state), macOS
#          (every display asleep) and GNOME or X11 on Linux. Anywhere else the
#          server answers "unknown" and the panel follows the login alone.
#   false  the panel follows the login alone, as it did before.
follow_display = true

# The spectrum bars over the buttons, Winamp-style: what this PC is playing
# right now, sixteen bars from bass to treble, streamed to the panel twenty
# times a second (ADR 0021). Only 16 levels leave the PC, never the audio, and
# capture runs only while the panel is lit and watching.
#   false  the default: nothing is captured and the space stays empty.
#   true   macOS 14.2 or newer: a Swift helper, built by install_agent.sh,
#          and macOS asks once for "System Audio Recording" for python3.
#          Windows: a C# helper (WASAPI loopback), compiled by
#          install_task.ps1 with the csc.exe Windows ships; no permission.
#          Linux: `parec` on the default output's monitor (libpulse on Arch
#          and CachyOS, pulseaudio-utils elsewhere), PipeWire or PulseAudio.
#          A PC that cannot capture says why at startup.
spectrum = false

# Which theme renders the panel — the name of a directory in the APK's
# web/themes/. Every theme is packaged, so switching one is a restart of this
# server and not a reinstall of the app.
#
# Shipped with the project:
#   neon   the cyberpunk skin the panel was designed as. The default.
#   plain  grey on black, one heading and a list per section, no glow. It
#          exists to prove a theme really is a directory (docs/THEMING.md).
#
# A name no packaged theme answers to is **not** an error here: the server has
# no idea which themes the installed APK was built with. The page falls back to
# "neon" and says so once in logcat, so a typo costs a look rather than a blank
# panel. Writing your own: docs/THEMING.md.
theme = "neon"

# Which language the panel speaks (T6.11). Everything a person reads from the
# chair comes from here: the weather condition, the card titles, the stale
# badge, the word for a phone running on its own battery, and the date, which
# is handed to the browser's own date formatter as this tag.
#
# Shipped with the project:
#   pt-BR  Brazilian Portuguese. The default, because that is where the panel
#          stands. A bare "pt" or a "pt-PT" lands here too.
#   en     English. "en-GB" and "en-US" land here too.
#
# Everything *else* in this repository is English on purpose -- code, comments,
# docs, commit messages -- and none of that is what somebody reads from two
# feet away, which is the one category that has to be in their language.
#
# A tag no packaged language answers to is not an error here, exactly as with
# `theme` above: the page falls back to pt-BR rather than to English, so a typo
# leaves the panel in the language its owner asked for last rather than
# switching it to one they did not ask for at all.
language = "pt-BR"


# ---------------------------------------------------------------------------
# Actions — reserved
# ---------------------------------------------------------------------------

# Which actions the panel may POST back. A list of **names**, never commands:
# the catalogue lives in `server/actions.py` and this file can only switch its
# entries on and off. That direction is the whole security argument, because
# this server has no authentication — anyone who can reach the port can run
# whatever is listed here, as often as they like. See
# docs/adr/0015-the-panel-can-act-on-the-pc.md.
#
# Two exist today, both toggles, both harmless to repeat:
#   "mute-audio"  mute/unmute the speakers
#   "mute-mic"    mute/unmute the microphone
#
# A name this server has no implementation for is a fatal error at startup,
# with the name in the message — not a button that quietly does nothing.
#
# Both are on in this example, because both are harmless to repeat and the
# buttons are half of what the panel is for on a desk you own. The server's own
# default, for a config that leaves this key out, is still `[]`, and `[]` is the
# right setting on any network you do not control. `shutdown`, `sleep` and
# `lock` are deliberately not available: the threat model above only holds for
# actions that are safe to repeat.
actions = ["mute-audio", "mute-mic"]


# ---------------------------------------------------------------------------
# Calendars — the next meeting on the AGENDA card (T9.1)
# ---------------------------------------------------------------------------

# Read docs/adr/0017-calendars-are-personal-data.md before turning this on.
# The short version: the grant is **read-only** (Google
# `calendar.events.readonly` + `calendar.calendarlist.readonly`, Microsoft
# `Calendars.ReadBasic`); Google reads every calendar you have switched on in
# Google Calendar, shared and subscribed ones included (ADR 0019), Outlook the
# default one; and the refresh tokens live on this PC in
# `server/calendar-tokens.json` (gitignored, mode 0600), never in this file and
# never on the phone.
#
# One table per account. `provider` is "google" or "microsoft"; `name` is yours,
# lowercase letters, digits and hyphens, and it is what the panel prints when an
# account needs reconnecting ("microsoft/work: reconnect"). Then connect each
# one, once, from this PC:
#
#     python server/calendar_login.py google --account personal
#     python server/calendar_login.py microsoft --account work
#
# A Microsoft *work or school* account belongs to its employer's tenant. The
# tenant may refuse consent to an app nobody there approved, and whether its
# calendar may sit on a panel at home is the employer's policy to answer.
#
# Empty, which is the default, costs nothing: no request, and the AGENDA card
# stays reserved.
calendar_accounts = []
# calendar_accounts = [
#     { provider = "google", name = "personal" },
#     { provider = "microsoft", name = "personal" },
#     { provider = "microsoft", name = "work" },
# ]

# The OAuth client ids you register yourself -- docs/SERVER-SETUP.md walks both.
# Nobody ships a shared one, and the reason is not modesty: a client id is where
# the consent screen, the quota and the right to revoke all live.
#
# Google's "Desktop app" client comes with a secret that Google's own
# documentation says is "obviously not treated as a secret". It is kept here
# anyway, beside the brapi token, because it is still half of a pair.
# Microsoft is a public client and has no secret at all.
google_client_id = ""
google_client_secret = ""
microsoft_client_id = ""

# How often the server asks the calendars, in seconds. Five minutes is well
# inside both providers' quotas, and a meeting added in the last five minutes is
# one you already know about. The countdown itself is redrawn on the phone every
# minute from the instant it already has, which costs no request.
calendar_interval_s = 300

# How far ahead to look, in hours. The card shows the next event; nothing
# further out than this is asked for.
calendar_lookahead_h = 24

# **Whether the panel shows meeting titles.** On, by the owner's decision, and
# with this cost: the server has no authentication, so **anyone on the same
# Wi-Fi can read the titles of your next meetings** at /quotes, and a title
# often names someone else. `false` removes every title on the server, before
# the payload is built; the card then says "in 25 min" and the LAN learns only
# that there is a meeting.
calendar_show_titles = true

# The meeting alerts (T9.5). A soft visual cue on the AGENDA card this many
# minutes before a meeting starts, and one quiet chime this many minutes before
# it. Whole minutes, 0 to 60; 0 turns that one off. Changing them is a server
# restart, never a rebuild.
agenda_soon_min = 5
agenda_chime_min = 1

# How loud the chime plays, 0 to 1, on top of the phone's media volume. The
# sound itself belongs to the theme: web/themes/<name>/chime.wav, falling back
# to web/sounds/chime.wav (docs/THEMING.md § Meeting alerts).
agenda_chime_volume = 0.4


# ---------------------------------------------------------------------------
# Hosts
# ---------------------------------------------------------------------------

# The names this server answers to besides an IP address and `localhost`. A
# request whose Host header is anything else gets 421 before any route runs,
# because that is the shape of a DNS rebinding attack: a web page you visit
# pointing its own name at this PC to read /quotes (ADR 0017). The phone always
# uses the IP, so this stays empty unless you browse to the PC by name, e.g.
# ["mypc.local"].
allowed_hosts = []


# ---------------------------------------------------------------------------
# Private traffic — nobody else on the Wi-Fi reads the panel (T9.4)
# ---------------------------------------------------------------------------

# Read docs/adr/0018-the-panel-traffic-is-private.md first. With all three of
# panel_key, tls_cert and tls_key set, the phone fetches data and sends presses
# over TLS on tls_port, with the key in a header. Without the key, or on the
# plain port, the answer is 401. /ping stays on `port`, open and in cleartext:
# it is the login signal, and a certificate problem must never look like a
# logout.
#
# All three, or none. None is the server as it always was: anyone on this
# network can read /quotes (calendar titles included) and press the enabled
# actions, and the server says so at every start.
#
# `python server/make_cert.py --ip <this PC's LAN address>` writes the
# certificate and key under server/tls/ (gitignored) and prints a key. The same
# key goes in PANEL_KEY in .env, and the certificate path in PC_CERTS, and then
# the APK is rebuilt: the phone pins the certificate at build time.
#
# Paths are relative to this file. The private key must be 0600.
panel_key = ""
tls_cert = ""
tls_key = ""
tls_port = 8778

# Whether GET /app hands out the APK. Off by default: once the APK carries
# panel_key, whoever downloads it has the key. Turn it on for an install, and
# off again after it.
serve_apk = false
