# Reasonix project config — the counterpart of .claude/settings.json.
#
# Reasonix reads CLAUDE.md (root and nested) and .claude/skills/ unchanged, so
# this file exists for the one thing it does not read: settings.json. Reasonix
# deliberately skips it because the hook and permission schemas differ
# (internal/config/paths.go, ConventionDirs).
#
# Keep the two files in step. `python scripts/check_permission_parity.py` is
# that rule enforced; it drifted within one PR of being declared a pair, so the
# check exists instead of another sentence asking people to remember.
#   - Bash(cmd:*) is canonical; Claude Code's Bash(cmd *) also parses.
#   - Edit(path) covers every file-mutating tool (write_file, edit_file, ...).
#   - Read(path) does NOT map — Reasonix's reader is read_file. Secrets are
#     protected by [sandbox] forbid_read below, which also covers `cat`.
#
# Every asymmetry between the two files is declared here with a
# `# parity: intentional` line naming the rules it covers. The checker reads
# those lines; an undeclared difference fails it.

# The model and its provider are pinned here rather than left to an untracked
# ~/.reasonix/config.toml, so "it worked on this machine" is reproducible from
# a clone. ADR 0011; the measurements behind the choice are in
# docs/LOCAL-MODELS.md.
default_model = "ollama-local/gemma4-128k-cc"

[[providers]]
name = "ollama-local"
kind = "openai"
base_url = "http://localhost:11434/v1"
default = "gemma4-128k-cc"
api_key_env = ""
# Not decoration: at 0 the harness disables compaction entirely and the run
# dies of context exhaustion instead of compacting. 131072 is the num_ctx the
# model's own Modelfile declares — Reasonix does not detect a server-side
# truncation, so a number larger than the Modelfile's is silently wrong.
context_window = 131072

[permissions]
mode = "ask"

allow = [
  # Inspection.
  "Bash(ls:*)", "Bash(cat:*)", "Bash(head:*)", "Bash(tail:*)", "Bash(wc:*)",
  "Bash(grep:*)", "Bash(rg:*)", "Bash(find:*)", "Bash(tree:*)", "Bash(file:*)",
  "Bash(which:*)", "Bash(pwd:*)", "Bash(diff:*)",
  # parity: intentional — Bash(ls:*), Bash(cat:*), Bash(head:*), Bash(tail:*),
  # Bash(wc:*), Bash(grep:*), Bash(rg:*), Bash(find:*), Bash(tree:*),
  # Bash(file:*), Bash(which:*), Bash(pwd:*), Bash(diff:*): Claude Code reads
  # and searches with its native Read/Grep/Glob tools, which no Bash rule
  # gates. Granting these there would widen the shell for nothing.

  # Test layers — every acceptance criterion in tasks/ is one of these.
  "Bash(make check:*)", "Bash(make test-server:*)", "Bash(make test-web:*)",
  "Bash(make test-android:*)", "Bash(make lint-tasks:*)", "Bash(make lint-notes:*)",
  "Bash(make connected:*)",
  "Bash(python -m unittest:*)", "Bash(python3 -m unittest:*)",
  "Bash(python -m json.tool:*)", "Bash(python3 -m json.tool:*)",
  "Bash(python scripts/:*)", "Bash(python3 scripts/:*)",
  "Bash(node --test:*)", "Bash(node --check:*)",
  "Bash(docker compose -f docker/compose.yml run --rm build:*)",
  # T0.1 has to build the image; the line above only covers running the service
  # once it exists. `config` validates compose.yml without starting anything.
  "Bash(docker compose -f docker/compose.yml build:*)",
  "Bash(docker compose -f docker/compose.yml config:*)",

  # The T0.1 ownership probe writes into out/, which is gitignored and absent
  # from a fresh checkout. Deleting is deliberately NOT granted: the `rm` in
  # that acceptance block is run by the reviewer, outside the harness.
  "Bash(mkdir:*)", "Bash(touch:*)", "Bash(test:*)",

  # Git, read side plus staging. Committing and pushing are denied below.
  "Bash(git status:*)", "Bash(git diff:*)", "Bash(git log:*)", "Bash(git show:*)",
  "Bash(git branch:*)", "Bash(git add:*)", "Bash(git check-ignore:*)",

  # Phone. `adb shell` and `adb install` are what T2.4, T4.4 and the E2E
  # scenarios actually run; leaving them out meant every device task stopped at
  # an approval prompt.
  "Bash(adb devices:*)", "Bash(adb logcat:*)", "Bash(adb shell:*)", "Bash(adb install:*)",

  # The server acceptance blocks reach the running server, and T7.1 reads the
  # signing certificate back out of the APK. `curl` is granted at exactly the
  # prefix those blocks use and no wider: a bare `Bash(curl:*)` is an
  # unprompted egress channel to any host on the internet, which is a large
  # thing to hand an agent in exchange for one localhost request.
  "Bash(curl -sf http://localhost:*)", "Bash(keytool:*)",
  # parity: intentional — WebFetch(domain:developer.android.com),
  # WebFetch(domain:docs.python.org), WebFetch(domain:nodejs.org),
  # WebFetch(domain:brapi.dev), WebFetch(domain:open-meteo.com): Reasonix has
  # no WebFetch tool and no equivalent rule, which is also why T3.3 and T3.4
  # are not local-model work (ADR 0011).
]

deny = [
  # Secrets, mutation side. The read side is [sandbox] forbid_read.
  "Edit(server/config.json)",
  "Edit(server/config.toml)",
  "Edit(keystore.properties)",

  # ADR 0011: the local model executes, Claude publishes. Reasonix has no git
  # tool at all, but the model can reach `bash git ...`, and a commit is the
  # first place an unverified completion report would become permanent.
  "Bash(git commit:*)",
  "Bash(git push:*)",
  # parity: intentional — Bash(git commit:*), Bash(git push:*): the same two
  # commands are ALLOWED in .claude/settings.json. That is the division of
  # labour, not drift: git belongs to the reviewing agent.
]

[sandbox]
# Hard read block: covers read_file, grep and `cat` alike, unlike a permission
# rule. The real config holds the brapi token, in either format (T3.12 reads
# both during the transition); the keystore signs the APK.
#
# MEASURED 2026-09-23: forbid_read matches literal paths only. With
# `*.keystore` here, `cat desk-panel.keystore` returned the file; with the
# name spelled out, the same command returned `Permission denied`. So the
# keystore is listed by name, and a second keystore would need a second line.
forbid_read = ["server/config.json", "server/config.toml", "keystore.properties", "desk-panel.keystore"]
# parity: intentional — Read(./*.keystore): .claude/settings.json can deny a
# glob and this file cannot, per the measurement above.
