name: Feature idea
description: Something the panel could do that it does not
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Most ideas for this panel touch one of the three invariants, which is
        not a reason to reject them — it is a reason to say so up front, so the
        conversation starts in the right place. They are stated in the README
        and argued in `docs/adr/`.
  - type: textarea
    id: idea
    attributes:
      label: What it should do, and who it is for
    validations:
      required: true
  - type: dropdown
    id: invariant
    attributes:
      label: Which invariant does it touch?
      options:
        - "None that I can see"
        - "1 — JavaScript never calls fetch; all network I/O is native"
        - "2 — The PC server is the login signal, and is session-scoped"
        - "3 — Screen state follows the PC, never a timeout"
        - "I am not sure"
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why the existing behaviour is not enough
      description: The panel is deliberately small. An idea that survives this question is usually worth building.
