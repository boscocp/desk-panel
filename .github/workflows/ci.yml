# Every push runs everything that does not need the phone (TT.9). Three jobs,
# independent, so a red one names the layer that broke rather than "CI".
#
# The commands here are the Makefile's, string for string, and
# `scripts/check_workflow.py` is what keeps them that way -- it reads both
# files and fails on any difference. The bootstrap skeleton this replaces was
# `workflow_dispatch` only and drifted for twenty-two waves precisely because
# nothing compared the two.
#
# The one allowed difference is the toolchain container: `make test-android`
# runs Gradle inside it to keep the developer's Windows host clean (ADR 0003),
# and a CI runner is disposable, so the `$(DC)` prefix is dropped and nothing
# else is. Every job runs from the repository root, like the Makefile -- the
# root `./gradlew` is a shim into android/, and a `working-directory:` here
# would make a command that matches the Makefile's text stop matching its
# meaning.
name: ci

on:
  push:
  pull_request:
  # Kept alongside them, not instead of them. This is what the bootstrap
  # skeleton had on its own, and on its own it is a workflow nobody runs -- so
  # check_workflow.py requires the two above and merely tolerates this one. It
  # earns its place by making `gh workflow run ci.yml --ref <branch>` work,
  # which is TT.9's acceptance line and the way a re-run is asked for without
  # an empty commit.
  workflow_dispatch:

# Least privilege, and it is enough: nothing here writes to the repository.
# The default token is read/write across the repo unless a workflow says
# otherwise, so saying otherwise is the whole point of the line (T7.8).
permissions:
  contents: read

# Three pushes to a branch should leave one run, not three. Free minutes on a
# public repo are not a reason to spend twenty of them per push, and on a
# private one they are billed -- see docs/MAINTAINING.md.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # No install step by design: the server uses only the standard library.
      # If this job ever needs pip, that is a design regression worth catching here.
      - run: python -m unittest discover -s server/tests -t .

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # No npm ci by design: there is no package.json.
      - run: node --test "web/test/**/*.test.js"

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      # No `build-root-directory:`. The first cut passed one, on the belief
      # that the cache had to be pointed at android/ where the real wrapper
      # lives -- and the run went green while the action printed "Unexpected
      # input(s) 'build-root-directory'" into its annotations and ignored it.
      # The input belongs to the older gradle/gradle-build-action, not to this
      # one. setup-gradle caches the Gradle User Home, which is the same
      # directory whichever subproject invoked it, so there was nothing to
      # point at. Noted rather than deleted quietly: a green check with a
      # silently discarded input is this wave's own subject arriving in its own
      # workflow.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew test
      - run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desk-panel-debug
          # android/app/build.gradle.kts copies the APK here; see its copyApk task.
          path: out/*.apk
          if-no-files-found: error
      # The phone's own tests are deliberately absent: they need the device.
      # android-actions/setup-android is avoided because it is third-party and
      # not GitHub-certified; setup-java plus the Gradle wrapper covers this.
