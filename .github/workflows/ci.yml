# Every push runs everything that does not need the phone (TT.9). Three jobs,
# independent, so a red one names the layer that broke rather than "CI".
#
# The commands here are the Makefile's, string for string, and
# `scripts/check_workflow.py` is what keeps them that way -- it reads both
# files and fails on any difference. The bootstrap skeleton this replaces was
# `workflow_dispatch` only and drifted for twenty-two waves precisely because
# nothing compared the two.
#
# The one allowed difference is the toolchain container: `make test-android`
# runs Gradle inside it to keep the developer's Windows host clean (ADR 0003),
# and a CI runner is disposable, so the `$(DC)` prefix is dropped and nothing
# else is. Every job runs from the repository root, like the Makefile -- the
# root `./gradlew` is a shim into android/, and a `working-directory:` here
# would make a command that matches the Makefile's text stop matching its
# meaning.
name: ci

on:
  push:
  pull_request:

# Least privilege, and it is enough: nothing here writes to the repository.
# T7.8 owns hardening the rest of what a public repo gets.
permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # No install step by design: the server uses only the standard library.
      # If this job ever needs pip, that is a design regression worth catching here.
      - run: python -m unittest discover -s server/tests -t .

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # No npm ci by design: there is no package.json.
      - run: node --test "web/test/**/*.test.js"

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          # The build lives in android/; the root gradlew is a shim. This tells
          # the cache where to look without moving the run steps off the root,
          # which is what keeps them identical to the Makefile's.
          build-root-directory: android
      - run: ./gradlew test
      - run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: desk-panel-debug
          # android/app/build.gradle.kts copies the APK here; see its copyApk task.
          path: out/*.apk
          if-no-files-found: error
      # The phone's own tests are deliberately absent: they need the device.
      # android-actions/setup-android is avoided because it is third-party and
      # not GitHub-certified; setup-java plus the Gradle wrapper covers this.
