# What `scripts/check_secrets.py` is allowed to find, and why.
#
# Every entry needs a `reason` and something to match on -- the script refuses the file
# otherwise, and exits 2 rather than passing. An allowlist of bare patterns is a way of
# turning a guard off with extra steps; the reason is what makes the second run readable.
#
# Fields:
#   rule    which rule this silences (omit or "*" for all of them)
#   path    the file, or an fnmatch glob over the repository-relative path
#   match   a substring the finding must contain
#   history true when the entry is about a blob in the history rather than a file in the
#           tree, which is how it escapes the stale check
#   reason  what this is and why publishing it is a decision rather than an accident
#
# Nothing here is a credential. Every entry was looked at on 2026-09-28 and the reasoning
# is written up in docs/PRE-PUBLIC-SWEEP.md.

# --- pinned dependency digests: the whole point of them is to be published -------------

[[allow]]
rule = "hex-blob"
path = ".github/workflows/*.yml"
reason = """
Action pins. `scripts/check_ci_hygiene.py` rule 3 *requires* every `uses:` to name a
40-character commit sha rather than a tag, so these are a guard's output, not a leak.
"""

[[allow]]
rule = "hex-blob"
path = "docker/Dockerfile"
reason = """
The base image digest. A digest is the pin nobody updates by hand, which is why
dependabot covers docker here (T7.8); it identifies a public image.
"""

[[allow]]
rule = "hex-blob"
path = "android/gradle/wrapper/gradle-wrapper.properties"
reason = "The Gradle distribution checksum, which is a published integrity hash."

[[allow]]
rule = "hex-blob"
path = "android/gradlew"
reason = "A commit sha in the wrapper script's own upstream comment. Vendored by Gradle."

[[allow]]
rule = "hex-blob"
path = "scripts/check_ci_hygiene.py"
reason = """
The fixture sha in that script's --self-test: a pin it asserts about. A real sha is used
because a made-up one would not be 40 hex characters and the rule would not fire.
"""

# --- captured command output, realistic on purpose -------------------------------------

[[allow]]
rule = "hex-blob"
path = "server/fixtures/login_scope/linux_cgroup_v1_docker.txt"
reason = """
A container id in captured `/proc/self/cgroup` output. TT.10's fixtures are real captures
because a fixture with invented shapes proves less than one taken from the machine; this
container no longer exists and an id is not a credential.
"""

[[allow]]
rule = "assigned-secret"
path = "server/tests/test_config_format.py"
match = "super-secret-token"
reason = """
The obviously-fake value that test asserts is *not* echoed back by the config endpoint.
A test about not leaking a token needs a token-shaped string to not leak.
"""

# --- the PC's real LAN address: prose about this desk, not a value that ships ----------

[[allow]]
rule = "lan-address"
path = "*.md"
reason = """
Markdown carries the real address on purpose. ADR 0013 is *about* the machine having a
real address rather than a placeholder; SERVER-SETUP.md tells an owner what their own
installation looks like by showing this one; STATUS.md and the harness notes are the
record of what was measured, and rewriting a record to look tidier is how a record stops
being worth keeping. An RFC1918 address is not reachable from outside the LAN it names.

Note `*` crosses `/` here -- this is fnmatch, not a shell glob -- so one entry covers
docs/, docs/adr/, docs/harness-notes/ and tasks/. That is deliberate: the line that
matters is the one below it, which keeps *source* to the placeholder.
"""

[[allow]]
rule = "lan-address"
path = "android/app/build.gradle.kts"
reason = """
An octet above 255 in the comment explaining why the parser range-checks rather than
counting digits. It is not an address at all, which is the point it is making.

The `match` field is deliberately not used here, and neither reason on this page quotes
the string it allows: this file is scanned like any other, and an allowlist entry whose
prose contains its own finding re-breaks the build. Found by review, after it did.
"""

[[allow]]
rule = "lan-address"
where = "history"
path = "android/app/src/test/java/dev/bosco/deskpanel/ActionsTest.java"
reason = """
T7.10 replaced the real address with the placeholder in this file, and the old blobs are
still in the pack -- which is exactly what the history half exists to show. Accepted
rather than rewritten: the same address is published deliberately in twenty Markdown
files (see the entry above), so removing it from a source blob's history would buy
nothing and cost a force-push over published commits.
"""

[[allow]]
rule = "lan-address"
where = "history"
path = "server/tests/test_actions.py"
reason = "The same change, in the other file that carried it. See the entry above."

[[allow]]
rule = "lan-address"
where = "history"
path = "android/app/src/test/java/dev/bosco/deskpanel/PcHostsTest.java"
match = ".1.101"
reason = """
Wave 35's first commit gave the test an address next to the placeholder, invented and
reaching no machine. `match` is a substring of the finding, and this fragment pins the entry
to that one address, so a real one in this file's history would still be found (narrowed
after a review). It is a fragment and not the whole address because an allowlist line that
spells its own finding is itself a finding in the tree; the tree half found them before review and the test uses plain host
names since. The blob stays in the pack. Accepted rather than rewritten, for the reason the
ActionsTest entry gives: a rewrite is a force-push over a published branch to hide a
string that was never anybody's network.
"""

# --- the scanner's own sample table, in the one commit before it was split -------------

[[allow]]
where = "history"
path = "scripts/check_secrets.py"
reason = """
The sample strings this script's --self-test feeds to its own rules. They are shaped like
credentials on purpose and open nothing: an AWS documentation key, a `ghp_` string of
filler, a truncated PEM header, and so on.

They were committed once, whole, before they were split into parts (see `_sample`), so the
blob from that commit trips ten rules. The tree is clean and stays clean -- that is the
gate, and it is strict on this exact file -- but the blob is in the pack of every clone,
which is precisely what the history half exists to say out loud.

This entry is deliberately wide: it allows every rule in this file's history rather than
naming ten. The narrower version is ten near-identical entries nobody would read, and the
protection that matters is on the other half, where a real key pasted into this file fails
the build before it can be committed.
"""

[[allow]]
where = "history"
path = "scripts/secrets-allowlist.toml"
reason = """
The same commit, the other file: two reasons on this page quoted the address they were
allowing, which is why neither does now. Nothing here has ever been a credential -- it is
a file of explanations about strings that look like one.
"""
